name: frictionmovieapp CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore frictionmovieapp.sln

      - name: Build application
        run: dotnet build frictionmovieapp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test frictionmovieapp.sln --configuration Release --no-build

  publish-image:
    name: Build and publish Docker image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fine4life/frictionmovieapp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/fine4life/frictionmovieapp

  deploy:
    name: Deploy to Minikube
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/setup-frictionmovieapp'
    runs-on: [self-hosted, Linux, X64, frictionmovieapp-minikube]

    permissions:
      contents: read

    concurrency:
      group: frictionmovieapp-minikube
      cancel-in-progress: false

    env:
      KUBECONFIG: /home/sylver/.kube/config
      IMAGE: ghcr.io/fine4life/frictionmovieapp:${{ github.sha }}

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Check cluster connection
        run: kubectl --context=minikube get nodes

      - name: Apply Deployment
        shell: bash
        run: |
          set -euo pipefail
          sed "s|FRICTIONMOVIEAPP_IMAGE|$IMAGE|g" k8s/deployment.yml |
            kubectl --context=minikube apply -n frictionmovieapp -f -

      - name: Apply Service
        run: kubectl --context=minikube apply -n frictionmovieapp -f k8s/service.yml

      - name: Wait for deployment
        run: |
          kubectl --context=minikube rollout status \
            deployment/frictionmovieapp \
            -n frictionmovieapp \
            --timeout=180s
